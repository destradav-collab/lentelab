<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>LenteLab RA · Tokens y LLM</title>
<script src="lib/aframe.min.js"></script>
<script src="lib/aframe-ar.js"></script>
<style>
[hidden]{display:none!important}
html,body{touch-action:none}
.zoom{position:fixed;z-index:11;right:calc(env(safe-area-inset-right,0px) + 12px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
.zoom button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(11,16,24,.85);color:var(--fg);font:600 22px/1 system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.zoom button.zv{font-size:12px;color:var(--holo)}
.zoom button:active{border-color:var(--holo)}
:root{--bg:#0B1018;--fg:#E7EDF4;--muted:#95A3B5;--holo:#6FE3E8;--amber:#F3B44E;--line:#243245}
html{background:#000}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg)}
.top{position:fixed;left:0;right:0;top:0;z-index:10;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;
  background:linear-gradient(rgba(11,16,24,.85),rgba(11,16,24,0));display:flex;align-items:center;gap:10px;pointer-events:none}
.brand{font-weight:700;letter-spacing:.02em}.brand b{color:var(--holo)}
.status{font-size:13px;color:var(--muted);margin-left:auto;text-align:right}
.status.found{color:var(--holo)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:rgba(11,16,24,.9);border-top:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet .st{margin:0 0 2px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.sheet h2{margin:0 0 4px;font-size:18px;color:var(--holo)}
.sheet p{margin:0;font-size:14px;line-height:1.5;color:var(--muted)}
.err{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);text-align:center;line-height:1.5}
</style>
<script>

/* zoom: pellizco con dos dedos o botones */
window.LZ=1;
function setZoom(z){window.LZ=Math.min(3,Math.max(.4,z));const v=document.getElementById('zv');if(v)v.textContent=window.LZ.toFixed(1)+'×';}
(function(){let d0=0,z0=1;const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  window.addEventListener('touchstart',e=>{if(e.touches.length===2){d0=dist(e);z0=window.LZ;}},{passive:true});
  window.addEventListener('touchmove',e=>{if(e.touches.length===2&&d0){e.preventDefault();setZoom(z0*dist(e)/d0);}},{passive:false});
  window.addEventListener('touchend',e=>{if(e.touches.length<2)d0=0;});
  window.addEventListener('gesturestart',e=>e.preventDefault());
  window.addEventListener('wheel',e=>{e.preventDefault();setZoom(window.LZ*(e.deltaY<0?1.1:1/1.1));},{passive:false});})();
const THREE=AFRAME.THREE;
const C={cyan:0x6FE3E8,amber:0xF3B44E,rose:0xF07A8B,violet:0xA58BF0,green:0x6FD39A,gray:0x5B6B80,fg:0xE7EDF4};
const HEX={cyan:'#6FE3E8',amber:'#F3B44E',rose:'#F07A8B',violet:'#A58BF0',green:'#6FD39A',fg:'#E7EDF4',ink:'#0B1018'};
const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.45,metalness:.1},o||{}));
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ease=k=>{k=clamp(k);return k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2};

/* texto como sprite (siempre mira a la cámara) */
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
function label(s,h,o){o=Object.assign({color:HEX.fg,bg:'rgba(11,16,24,.82)',size:72,bold:true},o||{});
  const c=document.createElement('canvas'),x=c.getContext('2d'),font=`${o.bold?700:500} ${o.size}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;
  x.font=font;const pad=o.size*.35,w=Math.ceil(x.measureText(s).width+pad*2),H=Math.ceil(o.size*1.45);c.width=w;c.height=H;
  x.font=font;if(o.bg){x.fillStyle=o.bg;rr(x,0,0,w,H,H*.28);x.fill()}
  x.fillStyle=o.color;x.textAlign='center';x.textBaseline='middle';x.fillText(s,w/2,H/2+o.size*.04);
  const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));
  sp.renderOrder=10;sp.scale.set(h*w/H,h,1);sp.userData.h=h;return sp}
function setOp(o,v){o.traverse(n=>{if(n.material){n.material.transparent=true;n.material.opacity=v}})}

/* 1. Mapa mental */
function buildMapa(){
  const g=new THREE.Group(),Cn=new THREE.Vector3(0,.5,0);
  const core=new THREE.Mesh(new THREE.SphereGeometry(.17,32,24),M(C.cyan,{emissive:0x1d5a60}));core.position.copy(Cn);g.add(core);
  const halo=new THREE.Mesh(new THREE.SphereGeometry(.2,24,16),new THREE.MeshBasicMaterial({color:C.cyan,wireframe:true,transparent:true,opacity:.25}));halo.position.copy(Cn);g.add(halo);
  const lab=label('LLM',.12,{color:HEX.cyan});lab.position.set(0,.8,0);g.add(lab);
  const names=['1 Tokens','2 Embeddings','3 Atención','4 Predicción','5 Generación'],cols=[C.amber,C.cyan,C.violet,C.rose,C.green],hx=[HEX.amber,HEX.cyan,HEX.violet,HEX.rose,HEX.green];
  const P=[],pul=[];
  names.forEach((n,i)=>{const a=-Math.PI/2+i*2*Math.PI/5,p=new THREE.Vector3(Math.cos(a)*.6,.42,Math.sin(a)*.6);P.push(p);
    const b=new THREE.Mesh(new THREE.BoxGeometry(.13,.13,.13),M(cols[i]));b.position.copy(p);g.add(b);
    const l=label(n,.075,{color:hx[i]});l.position.copy(p).add(new THREE.Vector3(0,.15,0));g.add(l);
    g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([Cn,p]),new THREE.LineBasicMaterial({color:C.cyan,transparent:true,opacity:.45})));
    const s=new THREE.Mesh(new THREE.SphereGeometry(.018,10,8),new THREE.MeshBasicMaterial({color:C.cyan}));g.add(s);pul.push(s);});
  const ring=[];for(let k=0;k<=64;k++){const a=k/64*Math.PI*2;ring.push(new THREE.Vector3(Math.cos(a)*.6,.42,Math.sin(a)*.6))}
  g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(ring),new THREE.LineBasicMaterial({color:C.amber,transparent:true,opacity:.35})));
  const tr=new THREE.Mesh(new THREE.BoxGeometry(.07,.07,.07),M(C.amber,{emissive:0x5a3a08}));g.add(tr);
  return {g,tick(t){halo.scale.setScalar(1+.12*Math.sin(t*3));
    pul.forEach((s,i)=>{const f=(t*.6+i*.2)%1;s.position.lerpVectors(Cn,P[i],f)});
    const seg=t/1.3,i=Math.floor(seg)%5,k=ease(seg%1),a=P[i],b=P[(i+1)%5];
    tr.position.lerpVectors(a,b,k);tr.position.y+=Math.sin(Math.PI*k)*.18;tr.rotation.set(t*2,t*2.5,0);}};
}

/* 2. Tokens */
function buildTokens(){
  const g=new THREE.Group(),T=[['El','3016',.16],['␣gato','18904',.25],['␣come','6223',.25],['␣pesc','41870',.25],['ado','2172',.18]];
  const cols=[C.amber,C.cyan,C.violet,C.rose,C.green],hx=[HEX.amber,HEX.cyan,HEX.violet,HEX.rose,HEX.green];
  const sent=label('El gato come pescado',.11);sent.position.set(0,.95,0);g.add(sent);
  const gap=.035,tot=T.reduce((s,t)=>s+t[2],0)+gap*4;let x=-tot/2;const items=[];
  T.forEach(([w,id,wd],i)=>{const it=new THREE.Group(),cx=x+wd/2;x+=wd+gap;
    const b=new THREE.Mesh(new THREE.BoxGeometry(wd,.12,.12),M(cols[i]));it.add(b);
    const l=label(w,.075,{color:hx[i]});l.position.set(0,.13,0);it.add(l);
    const n=label(id,.05,{color:'#C9D3DF',bold:false});n.position.set(0,-.12,0);it.add(n);
    it.userData.x=cx;g.add(it);items.push(it);});
  const cnt=label('20 caracteres → 5 tokens',.07,{color:HEX.cyan});cnt.position.set(0,.68,0);g.add(cnt);
  return {g,tick(t){const k=t%8;
    sent.material.opacity=k<1.2?1:clamp(1-(k-1.2)/.6,.3,1);
    items.forEach((it,i)=>{const s=1.4+i*.45,e=ease((k-s)/.6);it.visible=k>=s;
      it.position.set(it.userData.x*e,.95+(.35-.95)*e,0);it.scale.setScalar(.4+.6*e);});
    cnt.visible=k>4.2;cnt.material.opacity=clamp((k-4.2)/.5);}};
}

/* 3. Embeddings */
function buildEmb(){
  const g=new THREE.Group(),O=new THREE.Vector3(0,.5,0);
  [[1,0,0],[0,1,0],[0,0,1]].forEach(d=>{const a=new THREE.Vector3(...d).multiplyScalar(-.6).add(new THREE.Vector3(0,.5,0)),b=new THREE.Vector3(...d).multiplyScalar(.6).add(new THREE.Vector3(0,.5,0));
    g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),new THREE.LineBasicMaterial({color:0x8090a5,transparent:true,opacity:.35})));});
  const W=[['gato',[-.42,.66,-.1],'cyan'],['perro',[-.28,.8,.08],'cyan'],['león',[-.5,.48,.12],'cyan'],
           ['pescado',[.42,.7,-.06],'amber'],['atún',[.55,.54,.1],'amber'],['arroz',[.33,.44,.14],'amber'],
           ['come',[-.02,.24,.36],'violet'],['bebe',[.16,.17,.26],'violet']];
  const pts=W.map(([w,p,c])=>{const it=new THREE.Group();it.add(new THREE.Mesh(new THREE.SphereGeometry(.035,16,12),M(C[c],{emissive:new THREE.Color(C[c]).multiplyScalar(.25)})));
    const l=label(w,.06,{color:HEX[c]});l.position.set(0,.07,0);it.add(l);it.userData.p=new THREE.Vector3(...p);g.add(it);return it});
  const G=[['animales',[-.4,.65,.03],.24,'cyan'],['comida',[.43,.56,.06],.24,'amber'],['acciones',[.07,.2,.31],.17,'violet']];
  const clus=G.map(([n,p,r,c])=>{const s=new THREE.Mesh(new THREE.SphereGeometry(r,24,16),new THREE.MeshBasicMaterial({color:C[c],transparent:true,opacity:0,depthWrite:false}));s.position.set(...p);g.add(s);
    const l=label(n,.065,{color:'#0B1018',bg:HEX[c]});l.position.set(p[0],p[1]+r+.06,p[2]);g.add(l);return {s,l}});
  const vec=label('gato → [0.21, −1.30, 0.88, … miles más]',.065,{color:HEX.fg});vec.position.set(0,1.12,0);g.add(vec);
  return {g,tick(t){const k=t%9;
    pts.forEach((it,i)=>{const e=ease((k-.8-i*.08)/1.4);it.position.lerpVectors(O,it.userData.p,e)});
    clus.forEach(({s,l})=>{const v=clamp((k-3.2)/.8);s.material.opacity=v*.16;l.material.opacity=v;});}};
}

/* 4. Atención */
function buildAtt(){
  const g=new THREE.Group(),X=[-.54,-.18,.18,.54],Wd=['El','gato','come','pescado'];
  const boxes=Wd.map((w,i)=>{const b=new THREE.Mesh(new THREE.BoxGeometry(.24,.1,.14),M(C.gray));b.position.set(X[i],.08,0);g.add(b);
    const l=label(w,.08);l.position.set(X[i],.24,0);g.add(l);return b});
  const PH=[{q:2,w:{0:.06,1:.70,3:.14},cap:'“come” mira a “gato”: ¿quién come?'},{q:3,w:{0:.04,1:.30,2:.58},cap:'“pescado” mira a “come”: ¿qué se come?'}];
  const arcs=new THREE.Group();g.add(arcs);let cap=null,cur=-1,parts=[];
  function setPhase(i){cur=i;const ph=PH[i];
    arcs.children.slice().forEach(o=>{arcs.remove(o);o.geometry&&o.geometry.dispose();o.material&&o.material.map&&o.material.map.dispose();});
    if(cap){g.remove(cap)}cap=label(ph.cap,.07,{color:HEX.amber});cap.position.set(0,1.1,0);g.add(cap);
    boxes.forEach((b,j)=>b.material.color.setHex(j===ph.q?C.amber:C.gray));parts=[];
    Object.entries(ph.w).forEach(([j,w])=>{const a=new THREE.Vector3(X[ph.q],.32,0),b=new THREE.Vector3(X[j],.32,0),d=Math.abs(a.x-b.x);
      const ctl=new THREE.Vector3((a.x+b.x)/2,.36+d*.75,0),curve=new THREE.QuadraticBezierCurve3(a,ctl,b);
      const geo=new THREE.TubeGeometry(curve,48,.006+w*.035,10,false),m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:C.amber,transparent:true,opacity:.35+w*.65}));
      geo.setDrawRange(0,0);arcs.add(m);const top=curve.getPoint(.5);const pl=label(Math.round(w*100)+'%',.06,{color:HEX.amber});pl.position.set(top.x,top.y+.07,0);pl.material.opacity=0;arcs.add(pl);
      parts.push({geo,n:geo.index.count,pl});});}
  return {g,tick(t){const k=t%9,i=k<4.5?0:1,lk=k%4.5;if(i!==cur)setPhase(i);
    parts.forEach(p=>{const e=ease((lk-.3)/1.1);p.geo.setDrawRange(0,Math.floor(p.n*e/3)*3);p.pl.material.opacity=clamp((lk-1.3)/.5);});}};
}

/* 5. Predicción */
function buildPred(){
  const g=new THREE.Group(),R=[['pescado',62],['arroz',21],['rápido',11],['mucho',6]],X=[-.45,-.15,.15,.45];
  const s1=label('El gato come ___',.1),s2=label('El gato come pescado',.1,{color:HEX.rose});[s1,s2].forEach(s=>{s.position.set(0,1.08,0);g.add(s)});
  const bars=R.map(([w,p],i)=>{const geo=new THREE.BoxGeometry(.2,1,.2);geo.translate(0,.5,0);const b=new THREE.Mesh(geo,M(i===0?C.rose:C.violet));b.position.set(X[i],0,0);g.add(b);
    const h=.75*p/62,l=label(`${w} ${p}%`,.06,{color:i===0?HEX.rose:HEX.violet});g.add(l);return {b,h,l,x:X[i]}});
  return {g,tick(t){const k=t%8;
    bars.forEach((o,i)=>{const e=ease((k-.6-i*.12)/1.2),h=Math.max(.001,o.h*e);o.b.scale.y=h;o.l.position.set(o.x,h+.07,0);o.l.material.opacity=clamp((k-1.4)/.5);});
    const done=k>3.2;s1.visible=!done;s2.visible=done;bars[0].b.material.emissive.setHex(done?0x5a1a24:0x000000);}};
}

/* 6. Generación */
function buildGen(){
  const g=new THREE.Group(),W=['El','gato','come','pescado','fresco','.'],wd=.19,gap=.035,x0=-(W.length*wd+(W.length-1)*gap)/2+wd/2;
  const items=W.map((w,i)=>{const it=new THREE.Group(),isNew=i>2;it.add(new THREE.Mesh(new THREE.BoxGeometry(wd,.11,.12),M(isNew?C.rose:C.gray)));
    const l=label(w,.07,{color:isNew?HEX.rose:HEX.fg});l.position.set(0,.13,0);it.add(l);it.position.set(x0+i*(wd+gap),.1,0);g.add(it);return it});
  const think=new THREE.Mesh(new THREE.SphereGeometry(.045,16,12),new THREE.MeshBasicMaterial({color:C.rose,transparent:true}));g.add(think);
  const loop=new THREE.Group();loop.position.set(0,.62,0);g.add(loop);
  loop.add(new THREE.Mesh(new THREE.TorusGeometry(.2,.014,8,48,Math.PI*1.6),new THREE.MeshBasicMaterial({color:C.violet})));
  const cone=new THREE.Mesh(new THREE.ConeGeometry(.035,.08,12),new THREE.MeshBasicMaterial({color:C.violet}));const a=Math.PI*1.6;cone.position.set(Math.cos(a)*.2,Math.sin(a)*.2,0);cone.rotation.z=a;loop.add(cone);
  const l1=label('↻ el texto vuelve a entrar al modelo',.065,{color:HEX.violet});l1.position.set(0,1.0,0);g.add(l1);
  const vt=[];for(let v=1;v<=3;v++){const s=label('Vuelta '+v+': +1 token',.065,{color:HEX.rose});s.position.set(0,.88,0);g.add(s);vt.push(s)}
  return {g,tick(t){const k=t%9;loop.rotation.z=-t*1.5;
    let showing=-1;
    items.forEach((it,i)=>{if(i<3){it.visible=true;return}const s=1.2+(i-3)*2,e=ease((k-s-.7)/.4);it.visible=k>=s+.7;it.scale.setScalar(.3+.7*e);if(k>=s)showing=i-3;
      if(k>=s&&k<s+.7){think.visible=true;think.position.copy(it.position);think.material.opacity=.5+.5*Math.sin(k*14)}});
    if(!items.slice(3).some((it,i)=>{const s=1.2+i*2;return k>=s&&k<s+.7}))think.visible=false;
    vt.forEach((s,i)=>s.visible=i===showing&&k<7.5);}};
}

const BUILD={mapa:buildMapa,tokens:buildTokens,emb:buildEmb,att:buildAtt,pred:buildPred,gen:buildGen};
AFRAME.registerComponent('lentelab',{
  schema:{topic:{type:'string'}},
  init(){this.m=BUILD[this.data.topic]();this.el.setObject3D('mesh',this.m.g);this.t0=null;
    const mk=this.el.parentNode;mk.addEventListener('markerFound',()=>{this.t0=null});},
  tick(t){if(!this.base)this.base=this.el.object3D.scale.clone();this.el.object3D.scale.copy(this.base).multiplyScalar(window.LZ);if(this.t0===null)this.t0=t;this.m.tick((t-this.t0)/1000)}
});

const INFO={
  mapa:{s:'Mapa mental',t:'Cómo funciona un LLM',x:'El texto pasa por 5 pasos alrededor del modelo. El cubo amarillo recorre el camino: tokens, embeddings, atención, predicción y generación, y vuelve a empezar.'},
  tokens:{s:'Paso 1 de 5',t:'Tokens',x:'El modelo no lee palabras completas: corta el texto en tokens y a cada uno le da un número. “El gato come pescado” son 20 caracteres y 5 tokens.'},
  emb:{s:'Paso 2 de 5',t:'Embeddings',x:'Cada token se vuelve una lista de miles de números. En ese espacio, las palabras con significado parecido quedan cerca: animales con animales, comida con comida.'},
  att:{s:'Paso 3 de 5',t:'Atención',x:'Cada token mira a los demás para entender el contexto. El grosor de cada arco es cuánta atención le presta: “come” mira sobre todo a “gato”.'},
  pred:{s:'Paso 4 de 5',t:'Predicción',x:'El modelo calcula la probabilidad de cada token posible y elige uno. Para “El gato come…”, “pescado” gana con 62%.'},
  gen:{s:'Paso 5 de 5',t:'Generación',x:'El token elegido se agrega al texto y todo vuelve a entrar al modelo. Así, un token a la vez, se arma la respuesta.'}
};
let active=null;
function showSheet(k){const I=INFO[k];active=k;document.getElementById('sheet').hidden=false;
  document.getElementById('sS').textContent=I.s;document.getElementById('sT').textContent=I.t;document.getElementById('sX').textContent=I.x;}
window.addEventListener('load',()=>{
  const st=document.getElementById('status');let found=0;
  document.querySelectorAll('a-marker').forEach(m=>{
    m.addEventListener('markerFound',()=>{found++;st.textContent='Tarjeta detectada';st.classList.add('found');if(active!==m.dataset.k)showSheet(m.dataset.k)});
    m.addEventListener('markerLost',()=>{found=Math.max(0,found-1);if(!found){st.textContent='Apunta a una tarjeta';st.classList.remove('found')}});
  });
  window.addEventListener('camera-error',()=>{document.getElementById('err').hidden=false});
});
</script>
</head>
<body>
<div class="top"><span class="brand">Lente<b>Lab</b> · Tokens y LLM</span><span class="status" id="status">Apunta a una tarjeta</span></div>
<div class="sheet" id="sheet" hidden><p class="st" id="sS"></p><h2 id="sT"></h2><p id="sX"></p></div>
<div class="zoom"><button type="button" id="zin" aria-label="Acercar" onclick="setZoom(LZ*1.25)">+</button><button type="button" class="zv" id="zv" aria-label="Restablecer zoom" onclick="setZoom(1)">1.0×</button><button type="button" id="zout" aria-label="Alejar" onclick="setZoom(LZ/1.25)">−</button></div>
<div class="err" id="err" hidden><div><p><strong>No se pudo abrir la cámara.</strong></p><p>Permite el acceso a la cámara para este sitio en los ajustes del navegador y recarga la página.</p></div></div>

<a-scene embedded vr-mode-ui="enabled: false" loading-screen="enabled: false"
  renderer="logarithmicDepthBuffer: true; precision: medium;"
  arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; patternRatio: 0.5; cameraParametersUrl: data/camera_para.dat; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960;">
  <a-entity light="type: ambient; intensity: 0.75"></a-entity>
  <a-entity light="type: directional; intensity: 0.9" position="1 3 2"></a-entity>
